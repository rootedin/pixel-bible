<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 성경</title>
<link rel="stylesheet" href="engine/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  .pb-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 0 0 18px; }
  .pb-bar .pb-btn.on { background: #5a6a3a; box-shadow: inset 3px 3px 0 #8fae5e, inset -3px -4px 0 #3a4a22; color: var(--mc-yellow); }
  .pb-sec { margin: 26px 0 10px; color: var(--mc-yellow); font-size: 20px; text-shadow: 2px 2px 0 #3f3f00; }
  .pb-sec small { color: #bbb; font-size: 13px; text-shadow: none; margin-left: 8px; }
  .pb-card.locked { background: #2b2b2b; box-shadow: inset 3px 3px 0 #444, inset -3px -3px 0 #1b1b1b; cursor: default; opacity: .72; }
  .pb-card.locked:hover { background: #2b2b2b; }
  .pb-card.locked .t { color: #cfcfcf; }
  .pb-thumb { aspect-ratio: 16 / 9; border: 2px solid #000; margin-bottom: 8px; display: grid; place-items: center;
    background: repeating-linear-gradient(45deg, #3a3a3a 0 8px, #333 8px 16px); color: #9a9a9a; font-size: 13px; }
  .pb-tagx { float: right; font-size: 11px; padding: 1px 6px; border: 2px solid #000; }
  .pb-tagx.open { background: #4f9530; color: #fff; }
  .pb-tagx.soon { background: #5a5a5a; color: #ddd; }
  .pb-search { font-family: var(--font); font-size: 14px; color: #fff; background: #1b1b1b;
    border: 3px solid #000; box-shadow: inset 2px 2px 0 #444; padding: 7px 10px; width: 240px; }
  .pb-search::placeholder { color: #888; }
  /* 업적 모아 보기 */
  .pb-achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .pb-ach { display: flex; gap: 12px; align-items: center; text-decoration: none; color: #fff; background: #212121;
    border: 3px solid #000; box-shadow: inset 3px 3px 0 #3a3a3a, inset -3px -3px 0 #111; padding: 10px 12px; }
  .pb-ach:hover { background: #4a4f78; }
  .pb-ach canvas { width: 52px; height: 52px; flex: none; background: #8b8b8b; border: 3px solid #000;
    box-shadow: inset 3px 3px 0 #c6c6c6, inset -3px -3px 0 #555; padding: 6px; }
  .pb-ach .at { font-size: 16px; color: var(--mc-yellow); text-shadow: 2px 2px 0 #3f3f00; }
  .pb-ach .al { font-size: 12px; color: #bbb; margin-top: 4px; }
  .pb-ach:not(.got) { opacity: .7; }
  .pb-ach:not(.got) canvas { filter: grayscale(1) brightness(.5); }
  .pb-ach:not(.got) .at { color: #9a9a9a; text-shadow: none; }
</style>
<div class="pb-app">
  <div class="pb-titlescreen" style="position:relative;padding:30px 0 10px;background:none">
    <div class="pb-logo">픽셀 성경</div>
    <div class="pb-sub">블록으로 만나는 말씀</div>
  </div>
  <div class="pb-bar">
    <button class="pb-btn sm on" data-f="all">전체</button>
    <button class="pb-btn sm" data-f="open">열린 강의만</button>
    <button class="pb-btn sm" data-f="ot">구약</button>
    <button class="pb-btn sm" data-f="nt">신약</button>
    <button class="pb-btn sm" data-f="ach">업적</button>
    <input id="q" class="pb-search" type="search" placeholder="제목 · 본문 검색 (예: 창세기 3)" autocomplete="off">
    <span class="pb-sub" id="count" style="margin-left:10px"></span>
  </div>
  <div id="list"></div>
</div>
<script src="engine/world.js"></script>
<script src="engine/sprites.js"></script>
<script src="engine/engine.js"></script>
<script src="lessons/curriculum.js"></script>
<script src="lessons/list.js"></script>
<script>
(function () {
  // 흙 배경
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const g = cv.getContext('2d'), r = PB.rng(9);
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) { g.fillStyle = PB.TILES.D.f(x, y, r); g.fillRect(x, y, 1, 1); }
  g.fillStyle = 'rgba(0,0,0,0.62)'; g.fillRect(0, 0, 32, 32);
  document.body.style.backgroundImage = `url(${cv.toDataURL()})`;

  const OT = window.PB_OT_COUNT || 143;
  const made = {}; (window.PB_LESSONS || []).forEach(L => (made[L.week] = L));
  const all = (window.PB_CURRICULUM || []).map((c, i) => {
    const n = i + 1, L = made[n];
    return { n, title: (L && L.title) || c[0], ref: (L && L.ref) || c[1], file: L && L.file, cover: L && L.cover, ach: L && L.achievement, ot: n <= OT };
  });
  document.getElementById('count').textContent =
    `공개 ${Object.keys(made).length}강 / 전체 ${all.length}강 (구약 ${OT} · 신약 ${all.length - OT})`;

  const listEl = document.getElementById('list');

  /* 표지 렌더링 — 198강이면 캔버스를 한꺼번에 그리다 멈춘다
   * (캔버스 1장 = 256x144x4B ≈ 147KB, 타일 drawImage 약 600회)
   * 그래서 앞쪽 EAGER 장만 즉시 그리고, 나머지는 화면에 들어올 때 그린다.
   * IntersectionObserver 가 없거나 동작하지 않는 환경에서도 최소한 첫 화면은 보이게 하는 안전장치이기도 하다. */
  const EAGER = 12;
  const covers = new WeakMap();
  let io = null;
  function paint(c) {
    const sc = covers.get(c);
    if (!sc || c.dataset.done) return;
    c.dataset.done = '1';
    PB.renderStill(c, sc);
  }
  function newObserver() {
    if (io) { io.disconnect(); io = null; }
    if (typeof IntersectionObserver !== 'function') return;
    io = new IntersectionObserver(entries => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        io.unobserve(en.target);
        paint(en.target);
      }
    }, { rootMargin: '400px' });
  }
  function card(L) {
    const el = document.createElement(L.file ? 'a' : 'div');
    el.className = 'pb-card' + (L.file ? '' : ' locked');
    if (L.file) el.href = L.file;
    if (L.cover) {
      const c = document.createElement('canvas');
      c.width = PB.W; c.height = PB.H;          // 자리를 먼저 잡아 레이아웃이 튀지 않게
      covers.set(c, L.cover);                   // 실제 그리기는 draw() 끝에서 관찰 시작
      el.appendChild(c);
    }
    else el.insertAdjacentHTML('beforeend', '<div class="pb-thumb">오픈 예정</div>');
    el.insertAdjacentHTML('beforeend',
      `<div class="n">${L.ot ? '구약' : '신약'} ${String(L.n).padStart(3, '0')}강` +
      `<span class="pb-tagx ${L.file ? 'open' : 'soon'}">${L.file ? '열림' : '오픈 예정'}</span></div>` +
      '<div class="t"></div><div class="r"></div>');
    el.querySelector('.t').textContent = L.title;
    el.querySelector('.r').textContent = L.ref || '';
    return el;
  }
  function section(title, sub, rows) {
    if (!rows.length) return;
    listEl.insertAdjacentHTML('beforeend', `<div class="pb-sec">${title}<small>${sub}</small></div>`);
    const grid = document.createElement('div'); grid.className = 'pb-grid';
    rows.forEach(L => grid.appendChild(card(L)));
    listEl.appendChild(grid);
  }
  let filter = 'all', query = '';
  function draw() {
    newObserver();
    listEl.innerHTML = '';
    const q = query.trim().toLowerCase();
    const match = L => !q || (L.title + ' ' + (L.ref || '') + ' ' + L.n + '강' + (L.ach ? ' ' + L.ach.title : '')).toLowerCase().includes(q);
    if (filter === 'ach') return drawAch(match);
    const rows = all
      .filter(L => (filter === 'open' ? L.file : filter === 'ot' ? L.ot : filter === 'nt' ? !L.ot : true))
      .filter(match);
    const ot = rows.filter(L => L.ot), nt = rows.filter(L => !L.ot);
    section('구약', `${ot.length}강 · 공개 ${ot.filter(L => L.file).length}강`, ot);
    section('신약', `${nt.length}강 · 공개 ${nt.filter(L => L.file).length}강`, nt);
    if (!rows.length) listEl.insertAdjacentHTML('beforeend', '<div class="pb-sec">검색 결과가 없습니다.</div>');
    /* DOM 에 다 붙인 뒤에: 앞쪽은 바로 그리고, 나머지는 관찰만 건다 */
    const cvs = [...listEl.querySelectorAll('.pb-card canvas')];
    cvs.slice(0, EAGER).forEach(paint);
    if (io) cvs.slice(EAGER).forEach(c => io.observe(c));
    else cvs.slice(EAGER).forEach(paint);   // 옵저버가 없으면 전부 그린다
  }
  /* 업적 모아 보기 — 레슨 마지막 화면에 도달하면 이 브라우저에 기록된다 */
  function drawAch(match) {
    const got = PB.getAchievements ? PB.getAchievements() : {};
    const withAch = all.filter(L => L.ach);
    const done = withAch.filter(L => got[L.n]).length;
    listEl.insertAdjacentHTML('beforeend',
      `<div class="pb-sec">업적<small>달성 ${done} / ${withAch.length} · 레슨을 끝까지 마치면 열립니다 (이 기기에 저장)</small></div>`);
    const rows = withAch.filter(match);
    if (!rows.length) { listEl.insertAdjacentHTML('beforeend', '<div class="pb-sec">검색 결과가 없습니다.</div>'); return; }
    const grid = document.createElement('div'); grid.className = 'pb-achgrid';
    rows.forEach(L => {
      const el = document.createElement('a');
      el.className = 'pb-ach' + (got[L.n] ? ' got' : ''); el.href = L.file;
      const sp = PB.getSprite(L.ach.icon) || PB.getSprite('heart'), f = sp.frames[0];
      const c = document.createElement('canvas'); c.width = f.width; c.height = f.height;
      c.getContext('2d').drawImage(f, 0, 0);
      el.appendChild(c);
      el.insertAdjacentHTML('beforeend', '<div><div class="at"></div><div class="al"></div></div>');
      el.querySelector('.at').textContent = L.ach.title;
      el.querySelector('.al').textContent = `${String(L.n).padStart(3, '0')}강 ${L.title}` +
        (got[L.n] ? ` · ${new Date(got[L.n]).toLocaleDateString('ko-KR')} 달성` : ' · 아직 잠김');
      grid.appendChild(el);
    });
    listEl.appendChild(grid);
  }
  document.querySelectorAll('[data-f]').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
      filter = b.dataset.f; draw();
    };
  });
  let t = null;
  document.getElementById('q').addEventListener('input', e => {
    query = e.target.value;
    clearTimeout(t); t = setTimeout(draw, 150);
  });
  draw();
})();
</script>
